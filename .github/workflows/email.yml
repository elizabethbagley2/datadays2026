name: 'Email Notification Workflow'

on: workflow_dispatch

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Convert Notebook"
        run: |
          pip install jupter
          pip instrall -r requirements.txt
          jupter nbconvert --to html --execute analysis.ipynb --no-input
          ## run jupyter and convert to html
      - name: 'Send Mail'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          username: elizabethdbagley2@gmail.com
          password: ${{secrets.MAIL_DATA_DAYS}}
          subject: Github Actions Test
          to: ebagley@clevelandohio.gov
          html_body: file://analysis.html
